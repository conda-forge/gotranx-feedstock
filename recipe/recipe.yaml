schema_version: 1

context:
  python_min: "3.12"
  version: "2.11.0"

package:
  name: gotranx
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/g/gotranx/gotranx-${{ version }}.tar.gz
  sha256: 828e1538f5e47cdcff2a1e73e1b1b47516497c605af61dd1d7e8bf9afa200bc7

build:
  number: 0
  noarch: python
  python:
    entry_points:
      - gotranx = gotranx.cli:app
  script: ${{ PYTHON }} -m pip install . -vv --no-build-isolation --no-deps

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - attrs
    - lark
    - pint
    - rich-click
    - structlog
    - sympy
    - typer
    - toml
    - myokit
    - pandoc
    - click
    - black

tests:
  - python:
      imports:
        - gotranx
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - gotranx --help

about:
  homepage: https://github.com/finsberg/gotranx
  summary: A declarative language describing ordinary differential equations
  license: MIT
  license_file: LICENSE
  documentation: https://finsberg.github.io/gotranx/
  repository: https://github.com/finsberg/gotranx

extra:
  recipe-maintainers:
    - finsberg
